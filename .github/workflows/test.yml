# ci: install the project as the README says and run every test suite.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No third-party dependencies: the project uses only the Python standard library.
      - name: Unit and HTTP tests
        run: ./run.sh test
      - name: Acceptance tests (when present)
        run: |
          if [ -d tests/acceptance ]; then
            python -m pip install pytest==8.3.3
            python -m pytest tests/acceptance
          fi
